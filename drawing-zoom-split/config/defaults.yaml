# Default pipeline settings (overridden by .env)

pdf:
  dpi: 200
  max_llm_side: 1280

vision:
  runtime: groq
  require_llm: true
  groq_model: qwen/qwen3.6-27b

wing_crop:
  min_ink_ratio: 0.005
  min_plan_ratio: 0.05
  min_side_px: 80
  max_aspect: 50.0

roi_zoom:
  tile_size: 653
  overlap_pct: 0.10

verify:
  min_page_ink: 0.008
  min_diagram_ink: 0.01
  min_diagram_side: 400
  min_wing_short: 150
  min_wing_plan: 0.05

symbol_count:
  enabled: true
  nms_iou: 0.5
  llm_workers: 3
  use_full_wing_threshold: 1.5
  min_confidence: 0.6
