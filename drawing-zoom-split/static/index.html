<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawing Split · Symbol Count · Cost Invoice</title>
  <style>
    :root {
      --ink: #1c2330;
      --muted: #5c6778;
      --line: #d8deea;
      --paper: #eef2f8;
      --card: #fff;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --ok: #2f6f4e;
      --warn: #8a6d1f;
      --fail: #a33b3b;
      --shadow: 0 12px 40px rgba(28, 35, 48, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 500px at 10% -10%, #dbeafe 0%, transparent 55%), var(--paper);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 28px 36px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
    }
    header h1 { margin: 0; font-size: 22px; font-weight: 650; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    header .model { font-size: 12px; color: var(--muted); text-align: right; max-width: 420px; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
    .drop {
      border: 1.5px dashed #b9c0ce;
      background: var(--card);
      border-radius: 14px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .drop.drag { border-color: var(--accent); }
    input[type=file] { display: none; }
    .status {
      margin-top: 18px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: none;
    }
    .status.show { display: block; }
    .bar { height: 6px; background: #ece7dc; border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
    .bar > i { display: block; height: 100%; width: 18%; background: linear-gradient(90deg, var(--accent), #60a5fa); border-radius: 99px; animation: pulse 1.4s ease-in-out infinite; }
    .bar.done > i { width: 100%; animation: none; background: var(--ok); }
    .bar.fail > i { width: 100%; animation: none; background: var(--fail); }
    .bar.live > i { animation: none; transition: width 0.8s ease; }
    .eta { font-size: 13px; color: var(--accent-dark); font-weight: 600; margin-top: 2px; }
    @keyframes pulse { 0%,100% { width: 18%; } 50% { width: 72%; } }
    .meta { font-size: 13px; color: var(--muted); }
    .btn { border: 0; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; margin-right: 8px; margin-top: 6px; }
    .btn:hover { background: var(--accent-dark); }
    .btn.secondary { background: #e8eef9; color: var(--accent-dark); }
    .page { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
    .page h2 { margin: 0 0 6px; font-size: 16px; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
    .kept { background: #e5f3ea; color: var(--ok); }
    .skip { background: #f3ece5; color: var(--warn); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
    figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
    figure img { width: 100%; height: 160px; object-fit: contain; background: #f7f5f0; display: block; }
    figcaption { padding: 8px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    .totals { margin-top: 12px; text-align: right; font-size: 14px; }
    .totals strong { font-size: 18px; }
    .money { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Drawing Split · Symbol Count · Cost</h1>
      <p>PDF → symbol legend → wing ROI zooms → YOLO detect → pricing invoice</p>
    </div>
    <div class="model" id="health">Checking…</div>
  </header>
  <main>
    <label class="drop" id="drop">
      <strong>Drop a construction PDF</strong>
      <span>End-to-end: extract legend, zoom tiles, detect symbols, build cost invoice</span>
      <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp" />
    </label>
    <div class="status" id="status">
      <div id="statusTitle">Queued</div>
      <div class="bar" id="bar"><i></i></div>
      <div class="eta" id="statusEta"></div>
      <div class="meta" id="statusMeta"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div id="invoiceBox"></div>
    <div id="results"></div>
  </main>
  <script>
    const drop = document.getElementById("drop");
    const fileInput = document.getElementById("file");
    const statusEl = document.getElementById("status");
    const statusTitle = document.getElementById("statusTitle");
    const statusMeta = document.getElementById("statusMeta");
    const statusEta = document.getElementById("statusEta");
    const bar = document.getElementById("bar");
    const actions = document.getElementById("actions");
    const results = document.getElementById("results");
    const invoiceBox = document.getElementById("invoiceBox");
    let pollTimer = null;

    fetch("/api/health").then(r => r.json()).then(h => {
      const keyOk = h.runtime === "groq" ? h.groq_key_set : h.token_set;
      const yolo = h.yolo
        ? `YOLO ready · ${h.yolo_model} · ${(h.yolo_classes || []).length} classes`
        : "YOLO not ready";
      document.getElementById("health").innerHTML =
        `${h.runtime} · ${keyOk ? "vision key set" : "set API key in .env"} · ${h.model}<br/>${yolo}`;
    }).catch(() => { document.getElementById("health").textContent = "API not reachable"; });

    drop.addEventListener("click", () => fileInput.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("drag");
      if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });

    function imgUrl(jobId, rel) { return `/api/jobs/${jobId}/files/${rel}`; }
    function figure(src, caption) {
      return `<figure><img src="${src}" alt="${caption}" /><figcaption>${caption}</figcaption></figure>`;
    }
    function money(n) {
      const v = Number(n) || 0;
      return `$${v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }
    function fmtDuration(seconds) {
      const s = Math.max(0, Math.round(Number(seconds) || 0));
      if (s < 60) return `${s} sec`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m} min ${s % 60} sec`;
      return `${Math.floor(m / 60)} hr ${m % 60} min`;
    }

    async function renderInvoice(job) {
      invoiceBox.innerHTML = "";
      if (job.status !== "done") return;
      let counts = null;
      let invoice = null;
      try {
        counts = await fetch(`/api/jobs/${job.id}/counts`).then(r => r.ok ? r.json() : null);
      } catch (_) {}
      try {
        invoice = await fetch(`/api/jobs/${job.id}/invoice`).then(r => r.ok ? r.json() : null);
      } catch (_) {}
      if (!counts && !invoice) {
        if (job.invoice_grand_total_usd != null) {
          invoiceBox.innerHTML = `<section class="page"><h2>Cost invoice</h2>
            <p class="meta">Grand total ${money(job.invoice_grand_total_usd)} · ${job.symbol_count_total || 0} symbols</p>
          </section>`;
        }
        return;
      }
      const rows = (counts && counts.rows) || [];
      const lines = (invoice && invoice.lines) || [];
      let html = `<section class="page"><h2>Symbol counts &amp; cost invoice</h2>
        <div><a class="btn" href="/api/jobs/${job.id}/invoice.pdf" target="_blank">Open invoice PDF</a></div>`;
      if (counts && counts.method === "skipped_legend_mismatch") {
        html += `<p style="color:var(--warn);font-weight:600;margin:12px 0 4px">${counts.note || "Symbol detection skipped — model does not apply to this drawing set."}</p>`;
      }
      html += `<p class="meta">${counts ? (counts.note || "") : ""} · ${rows.length} priced rows · ${counts ? counts.total_count : job.symbol_count_total || 0} units</p>`;
      if (rows.length) {
        html += `<table><thead><tr><th>Description</th><th>Detail</th><th>YOLO</th><th>Count</th></tr></thead><tbody>`;
        for (const r of rows) {
          html += `<tr><td>${r.description || ""}</td><td class="meta">${r.detail_ref || ""}</td>
            <td class="meta">${(r.yolo_classes || []).join(", ")}</td><td><strong>${r.count || 0}</strong></td></tr>`;
        }
        html += `</tbody></table>`;
      }
      const unmatched = (counts && counts.yolo_unmatched) || [];
      if (unmatched.length) {
        const unmatchedTotal = unmatched.reduce((sum, u) => sum + (u.count || 0), 0);
        html += `<h3 style="margin:18px 0 4px;font-size:15px;color:var(--warn)">
          Detected but NOT matched to legend (${unmatchedTotal} symbols — not priced)</h3>`;
        html += `<table><thead><tr><th>Detected symbol</th><th>Count</th><th>Why not matched</th></tr></thead><tbody>`;
        for (const u of unmatched) {
          html += `<tr><td>${u.class_name || ""}</td><td><strong>${u.count || 0}</strong></td>
            <td class="meta">${u.reason || ""}</td></tr>`;
        }
        html += `</tbody></table>`;
      }
      if (lines.length) {
        html += `<h3 style="margin:18px 0 4px;font-size:15px">Invoice lines</h3>`;
        html += `<table><thead><tr><th>Device</th><th>Qty</th><th>Unit</th><th>Unit price</th><th>Line total</th></tr></thead><tbody>`;
        for (const ln of lines) {
          html += `<tr><td>${ln.description}</td><td>${ln.quantity}</td><td>${ln.unit}</td>
            <td class="money">${money(ln.unit_price_usd)}</td>
            <td class="money"><strong>${money(ln.line_total_usd)}</strong></td></tr>`;
        }
        html += `</tbody></table>`;
        html += `<div class="totals">
          <div>Subtotal <span class="money">${money(invoice.subtotal_usd)}</span></div>
          <div>Tax <span class="money">${money(invoice.tax_usd)}</span></div>
          <div><strong>Grand total <span class="money">${money(invoice.grand_total_usd)}</span></strong></div>
        </div>`;
      }
      html += `</section>`;
      invoiceBox.innerHTML = html;
    }

    function renderJob(job) {
      statusEl.classList.add("show");
      statusTitle.textContent = job.message || job.stage || job.status;
      statusMeta.textContent = `${job.filename || ""} · ${job.status} · ${job.stage || ""}`;
      const inner = bar.querySelector("i");
      bar.classList.remove("done", "fail", "live");
      inner.style.width = "";
      if (job.status === "done") bar.classList.add("done");
      if (job.status === "failed") bar.classList.add("fail");
      const active = job.status === "queued" || job.status === "processing";
      if (active && job.progress != null) {
        bar.classList.add("live");
        inner.style.width = `${Math.max(3, Math.min(99, job.progress * 100))}%`;
      }
      if (active && job.eta_seconds != null) {
        statusEta.textContent =
          `Estimated time remaining: ${fmtDuration(job.eta_seconds)}` +
          (job.estimated_total_seconds != null
            ? ` (total ~${fmtDuration(job.estimated_total_seconds)})`
            : "");
      } else if (job.status === "done" && job.actual_seconds != null) {
        statusEta.textContent = `Finished in ${fmtDuration(job.actual_seconds)}`;
      } else {
        statusEta.textContent = "";
      }
      actions.innerHTML = job.status === "done"
        ? `<button class="btn" onclick="document.getElementById('invoiceBox').scrollIntoView({behavior:'smooth'})">Show invoice</button>
           <a class="btn" href="/api/jobs/${job.id}/invoice.pdf" target="_blank">Invoice PDF</a>
           <a class="btn secondary" href="/api/jobs/${job.id}/invoice.csv">Invoice CSV</a>
           <a class="btn secondary" href="/api/jobs/${job.id}/zip">Download zip</a>
           <a class="btn secondary" href="/api/jobs/${job.id}/counts">Counts JSON</a>`
        : "";

      if (job.status === "done") renderInvoice(job);
      else invoiceBox.innerHTML = "";

      if (!job.pages || !job.pages.length) { results.innerHTML = ""; return; }
      results.innerHTML = job.pages.map(page => {
        const badge = page.kept
          ? `<span class="badge kept">DRAWING</span>`
          : `<span class="badge skip">SKIPPED</span>`;
        let body = "";
        if (page.page_image) {
          body += `<div class="grid">${figure(imgUrl(job.id, page.page_image), "Full sheet")}</div>`;
        }
        if (page.reason) body += `<p class="meta">${page.reason}</p>`;
        if (page.diagram) {
          body += `<h3 style="margin:18px 0 4px;font-size:15px">Diagram crop</h3>`;
          body += `<div class="grid">${figure(imgUrl(job.id, page.diagram), "Full diagram")}</div>`;
          const wings = page.wings || [];
          if (wings.length) {
            body += `<h4 style="margin:16px 0 4px;font-size:14px">Wings (${wings.length})</h4>`;
            body += `<div class="grid">${wings.map(w => {
              const overlay = w.roi_overlay_image
                ? figure(imgUrl(job.id, w.roi_overlay_image), `${w.name} ROI overlay`)
                : "";
              const wing = figure(imgUrl(job.id, w.image), `${w.name} wing`);
              return overlay ? overlay + wing : wing;
            }).join("")}</div>`;
          }
        }
        return `<section class="page"><h2>Page ${page.page}${badge}</h2>${body || '<p class="meta">No drawing.</p>'}</section>`;
      }).join("");
    }

    async function poll(jobId) {
      const job = await fetch(`/api/jobs/${jobId}`).then(r => r.json());
      renderJob(job);
      if (job.status === "done" || job.status === "failed") {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    async function upload(file) {
      if (pollTimer) clearInterval(pollTimer);
      statusEl.classList.add("show");
      bar.classList.remove("done", "fail");
      statusTitle.textContent = "Uploading…";
      statusMeta.textContent = file.name;
      results.innerHTML = "";
      invoiceBox.innerHTML = "";
      const data = new FormData();
      data.append("file", file);
      const res = await fetch("/api/jobs", { method: "POST", body: data });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        statusTitle.textContent = "Upload failed";
        statusMeta.textContent = err.detail || "error";
        bar.classList.add("fail");
        return;
      }
      const job = await res.json();
      renderJob(job);
      pollTimer = setInterval(() => poll(job.id), 1500);
    }
  </script>
</body>
</html>
